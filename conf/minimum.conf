
http {
    server {
        #listen     80
        listen      8080;
        server_name localhost;
        #error_page 404         /error/404.html;
        error_page 500         /error/50X.html;
        error_page 501         /error/50X.html;
        error_page 502         /error/50X.html;
        error_page 503         /error/50X.html;
        error_page 504         /error/50X.html;
        error_page 505         /error/50X.html;

        client_max_body_size 3000000;
        location / {
            root    www;
            index   index.html index.htm;
        }
        location /tapir {
            root    www;
            index   index.html;
        }
        location /hack {
            root    www;
            index   ti.html;
            #index   nelson.html;
            #index    ti.html
        }
        location /mail_send {
            root www;
            autoindex on;
            index _;
        }
        location /cgi-bin {
            root www;
        }
    }
}
