
http {
    server {
        listen      8080;
        server_name localhost;
        #error_page 404         /error/404.html;
        error_page 500         /error/50X.html;
        error_page 501         /error/50X.html;
        error_page 502         /error/50X.html;
        error_page 503         /error/50X.html;
        error_page 504         /error/50X.html;
        error_page 505         /error/50X.html;

        client_max_body_size 100;

        location / {
            root    YoupiBanane;
            index   index.html index.htm;
        }
        location /nop {
            root YoupiBanane;
        }
        location /Yeah {
            root YoupiBanane;
        }

    }
}
